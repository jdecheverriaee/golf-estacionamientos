<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Estacionamientos · Golf Bicentenario · bakerlab.</title>
<meta name="theme-color" content="#262626">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#262626; --panel:#2E2E2E; --panel2:#363636; --hover:#3A3A3A; --line:#404040; --line2:#333;
    --ink:#F5F5F5; --muted:#A3A3A3; --accent:#FFEB33; --accent-ink:#262626;
    --c-libre:#4ADE80; --c-reservado:#FB923C; --c-asignado:#FFEB33; --c-nodisp:#8C8C8C;
    --sel:#FFFFFF; --danger:#F87171;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;display:flex;flex-direction:column;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  ::selection{background:var(--accent);color:var(--accent-ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#4A4A4A;border-radius:99px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  /* Header */
  header{background:#1F1F1F;border-bottom:1px solid var(--line2);padding:10px 18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;flex:none}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{height:30px;display:block}
  .brand .sep{width:1px;height:30px;background:var(--line)}
  .brand b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .brand small{color:var(--muted);font-size:11.5px}
  nav{display:flex;gap:2px;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--line2)}
  nav button{background:none;border:0;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600}
  nav button:hover{color:var(--ink)}
  nav button.on{background:var(--accent);color:var(--accent-ink)}
  .kpis{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
  .kpi{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .kpi b{font-size:15px;color:var(--ink)}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

  .view{flex:1;min-height:0;display:none}
  .view.on{display:flex}

  /* ---------- PLANO ---------- */
  #vPlano{flex-direction:column}
  .pbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--line2)}
  .pisoSel{display:flex;align-items:center;gap:4px}
  .pisoSel select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-weight:600;min-width:260px;cursor:pointer}
  .ib{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;cursor:pointer;display:inline-grid;place-items:center;font-size:15px}
  .ib:hover{background:var(--hover);border-color:var(--accent);color:var(--accent)}
  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
  .chip:hover{background:var(--hover)}
  .chip.off{opacity:.4;text-decoration:line-through}
  .chip em{font-style:normal;color:var(--muted)}
  .search{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
  .search::placeholder,.fld::placeholder{color:#7A7A7A}
  .search:focus,.fld:focus{outline:none;border-color:var(--accent)}
  .zoom{display:flex;gap:4px}

  .pbody{flex:1;min-height:0;display:flex}
  .viewport{flex:1;position:relative;overflow:hidden;background:var(--bg);cursor:grab;touch-action:none}
  .viewport.drag{cursor:grabbing}
  .stage{position:absolute;left:0;top:0;transform-origin:0 0}
  .stage img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none;filter:invert(.85);opacity:.72}
  .vpmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px;pointer-events:none}
  .found{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:340px;display:none;line-height:1.7}
  .found a{color:var(--accent);cursor:pointer;text-decoration:underline;margin-right:6px}

  .mk{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));transform-origin:center;border:0;padding:0;background:none;cursor:pointer}
  .mk span{display:block;min-width:30px;height:21px;padding:0 5px;border-radius:11px;color:#1A1A1A;font-size:11.5px;font-weight:700;line-height:17px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.5);border:2px solid #1A1A1A}
  .mk em{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-style:normal;font-size:10.5px;font-weight:700;background:rgba(26,26,26,.92);color:var(--ink);padding:0 5px;border-radius:4px;white-space:nowrap;display:none}
  .stage.det .mk em{display:block}
  .mk.Libre span{background:var(--c-libre)}
  .mk.Reservado span{background:var(--c-reservado)}
  .mk.Asignado span{background:var(--c-asignado)}
  .mk.Nodisponible span{background:var(--c-nodisp)}
  .mk:hover span{filter:brightness(1.12)}
  .mk.sel span{outline:3px solid var(--sel);outline-offset:1px}
  .mk.sel{z-index:3}
  .mk.dim{opacity:.15}
  .mk.off{display:none}
  .mk.hit{z-index:4}
  .mk.hit span{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,235,51,.7)}50%{box-shadow:0 0 0 10px rgba(255,235,51,0)}}

  .tip{position:fixed;pointer-events:none;background:#1A1A1A;border:1px solid var(--line);color:var(--ink);font-size:12px;padding:7px 10px;border-radius:8px;z-index:20;display:none;max-width:260px;line-height:1.45}

  /* Panel lateral */
  .side{width:340px;flex:none;background:var(--panel);border-left:1px solid var(--line2);overflow:auto;padding:18px}
  .side h3{margin:0 0 4px;font-size:15px;font-weight:700}
  .side .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .stbars .row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
  .stbars .row .lb{width:104px}
  .stbars .row .tr{flex:1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
  .stbars .row .tr i{display:block;height:100%}
  .stbars .row b{width:34px;text-align:right}
  .hint{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:12.5px;line-height:1.55;margin:16px 0}
  .dl{margin-top:8px}
  .dl .d{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
  .dl .d:hover{background:var(--hover)}
  .dl .d span{color:var(--muted)}
  .selchips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}
  .selchips button{border:0;border-radius:99px;padding:3px 9px;color:#1A1A1A;font-weight:700;font-size:12px;cursor:pointer}
  .info{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.65;margin-bottom:12px;color:var(--muted)}
  .info b{font-weight:600;color:var(--ink)}
  label.l{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px}
  .seg button:hover{background:var(--hover)}
  .seg button.on{border-color:var(--accent);font-weight:700}
  .fld{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
  .fld:disabled{opacity:.45}
  textarea.fld{resize:vertical;min-height:58px}
  .warn{color:var(--c-reservado);font-size:12.5px;margin-top:8px}
  .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .btn{border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700}
  .btn.p{background:var(--accent);color:var(--accent-ink);flex:1}
  .btn.p:hover{filter:brightness(1.06)}
  .btn.r{background:rgba(248,113,113,.14);color:var(--danger)}
  .btn.g{background:var(--hover);color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:wait}

  /* ---------- DASHBOARD ---------- */
  #vDash,#vList{overflow:auto;padding:20px;flex-direction:column;gap:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
  .card .t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
  .card .v{font-size:30px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
  .card .p{font-size:12px;color:var(--muted)}
  .card.hl{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .card.hl .t,.card.hl .p{color:rgba(38,38,38,.75)}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  @media (max-width:1000px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:16px}
  .panel h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .panel h3 small{font-weight:400;color:var(--muted)}
  .fb{display:grid;grid-template-columns:120px 1fr 96px;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;cursor:pointer}
  .fb:hover{background:var(--hover)}
  .fb .bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--bg);gap:2px}
  .fb .bar i{display:block;height:100%}
  .fb .n{font-size:12px;color:var(--muted);text-align:right}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
  .legend span{display:flex;align-items:center;gap:5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:9px 8px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:1}
  td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--hover)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .scroll{max-height:380px;overflow:auto}

  /* ---------- LISTADO ---------- */
  .lbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .lbar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
  .lt td input,.lt td select{padding:5px 8px;border:1px solid transparent;border-radius:7px;background:transparent;width:100%}
  .lt td input:hover,.lt td select:hover{border-color:var(--line)}
  .lt td input:focus,.lt td select:focus{border-color:var(--accent);background:var(--bg);outline:none}
  .lt td.saving{opacity:.5}
  .lt input.need{border-color:var(--c-reservado);background:rgba(251,146,60,.1)}
  .lt tr:hover td{background:rgba(255,255,255,.02)}
  .go{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 8px;cursor:pointer;font-size:12px}
  .go:hover{border-color:var(--accent);color:var(--accent)}

  .user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .user button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
  .user button:hover{border-color:var(--accent);color:var(--accent)}

  .login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:16px}
  .login[hidden]{display:none}
  .lgcard{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:32px;width:min(400px,100%);box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .lgcard .lglogo{height:64px;display:block;margin-bottom:26px}
  .lgcard h1{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .lgcard p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .lgcard label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .lgcard label span{font-weight:500;text-transform:none;letter-spacing:0}
  .lgcard .btn{width:100%;margin-top:20px;padding:12px}
  .lgerr{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
  .lgfoot{margin-top:22px;font-size:11.5px;color:#7A7A7A;text-align:center}
  .lgfoot b{color:var(--accent);font-weight:600}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.show{opacity:1}
  .toast.err{background:var(--danger);color:#1A1A1A}
  .loading{flex:1;display:grid;place-items:center;color:var(--muted)}
  .credit{position:fixed;right:12px;bottom:8px;font-size:10.5px;color:#6B6B6B;z-index:5;pointer-events:none}
  .credit b{color:var(--accent);font-weight:600}

  @media (max-width:800px){
    .pbody{flex-direction:column}
    .side{width:auto;max-height:45vh;border-left:0;border-top:1px solid var(--line2)}
    .kpis,.brand .sep,.brand small,.credit{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/icono-bakerlab.svg" alt="bakerlab."><span class="sep"></span><div><b>Estacionamientos · Golf Bicentenario</b><small>Vitacura 2987 / Luz 2988 · Las Condes</small></div></div>
  <nav id="nav">
    <button data-v="vPlano" class="on">Plano</button>
    <button data-v="vDash">Dashboard</button>
    <button data-v="vList">Listado</button>
  </nav>
  <div class="kpis" id="kpis"></div>
  <div class="user"><span id="uName"></span><button id="bSalir" title="Cerrar sesión">Salir</button></div>
</header>

<!-- PLANO -->
<section class="view on" id="vPlano">
  <div class="pbar">
    <div class="pisoSel">
      <button class="ib" id="prevP" title="Piso anterior">‹</button>
      <select id="selPiso"></select>
      <button class="ib" id="nextP" title="Piso siguiente">›</button>
    </div>
    <div class="chips" id="chipsE"></div>
    <input class="search" id="q" type="search" placeholder="Buscar depto o N° de estacionamiento…">
    <div class="zoom">
      <button class="ib" id="zIn" title="Acercar">+</button>
      <button class="ib" id="zOut" title="Alejar">−</button>
      <button class="ib" id="zFit" title="Ajustar a pantalla">⤢</button>
    </div>
  </div>
  <div class="pbody">
    <div class="viewport" id="vp">
      <div class="stage" id="stage"><img id="img" alt=""><div id="marks"></div></div>
      <div class="vpmsg" id="vpmsg">Cargando…</div>
      <div class="found" id="found"></div>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</section>

<!-- DASHBOARD -->
<section class="view" id="vDash"></section>

<!-- LISTADO -->
<section class="view" id="vList">
  <div class="lbar">
    <select id="lPiso"></select>
    <select id="lEstado"></select>
    <input class="search" id="lq" type="search" placeholder="Buscar N°, depto u observación…">
    <span id="lCount" style="color:var(--muted);font-size:12.5px"></span>
  </div>
  <div class="panel" style="padding:0;overflow:auto;flex:1;min-height:0">
    <table class="lt"><thead><tr><th style="width:80px">N°</th><th style="width:70px">Piso</th><th style="width:170px">Estado</th><th style="width:150px">Depto</th><th>Observaciones</th><th style="width:150px">Actualizado</th><th style="width:70px"></th></tr></thead><tbody id="lBody"></tbody></table>
  </div>
</section>

<datalist id="dlDeptos"></datalist>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<div class="credit">by <b>bakerlab.</b></div>

<div class="login" id="login" hidden>
  <form class="lgcard" id="lgForm">
    <img class="lglogo" src="/logo-bakerlab.svg" alt="bakerlab.">
    <h1>Estacionamientos</h1>
    <p>Golf Bicentenario · Vitacura 2987 / Luz 2988</p>
    <label for="lgNombre">Tu nombre <span>(queda registrado en el historial)</span></label>
    <input class="fld" id="lgNombre" autocomplete="name" required maxlength="60">
    <label for="lgPass">Contraseña</label>
    <input class="fld" id="lgPass" type="password" autocomplete="current-password" required>
    <div class="lgerr" id="lgErr"></div>
    <button class="btn p" type="submit" id="lgBtn">Entrar</button>
    <div class="lgfoot">Plataforma desarrollada por <b>bakerlab.</b></div>
  </form>
</div>

<script>
const COL = {'Libre':'var(--c-libre)','Reservado':'var(--c-reservado)','Asignado':'var(--c-asignado)','No disponible':'var(--c-nodisp)'};
const HEX = {'Libre':'#4ADE80','Reservado':'#FB923C','Asignado':'#FFEB33','No disponible':'#8C8C8C'};
const BG  = {'Libre':'rgba(74,222,128,.14)','Reservado':'rgba(251,146,60,.15)','Asignado':'rgba(255,235,51,.14)','No disponible':'rgba(140,140,140,.18)'};
const cls = e => e.replace(/\s/g,'');
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Comunicación con el servidor (Vercel → Google Sheets) ---------- */
let USUARIO = '';
try { USUARIO = localStorage.getItem('estac_nombre') || ''; } catch(e) {}

async function api(fn, ...args){
  if (window.DEMO) return new Promise((res, rej) => setTimeout(() => { try { res(DEMO.api[fn](...args)); } catch(e){ rej(e); } }, 120));
  if (fn === 'getPlano') return '/api/plano?k=' + encodeURIComponent(args[0]);
  const opt = fn === 'getDatos' ? {cache:'no-store'} :
    {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({numeros:args[0], cambios:args[1], usuario:USUARIO})};
  const r = await fetch(fn === 'getDatos' ? '/api/datos' : '/api/guardar', opt);
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (r.status === 401){ mostrarLogin(); const e = new Error('Inicia sesión para continuar'); e.auth = true; throw e; }
  if (!r.ok) throw new Error(j.error || ('Error de conexión (' + r.status + ')'));
  return j;
}

/* ---------- Estado de la app ---------- */
let D = {spots:[], pisos:[], estados:[], hist:[]};
let piso = null, sel = new Set(), q = '', ocultos = new Set();
let form = {estado:null, depto:'', obs:''};
const imgCache = {};
const view = {s:1, tx:0, ty:0, W:2800, H:2267};

function toast(m, err){ const t=$('toast'); t.textContent=m; t.className='toast show'+(err?' err':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast', 2800); }
const spotsPiso = p => D.spots.filter(s => s.piso === p);
const byN = n => D.spots.find(s => s.n === n);
function counts(list){ const c={}; D.estados.forEach(e=>c[e]=0); list.forEach(s=>c[s.estado]=(c[s.estado]||0)+1); return c; }
function deptoMap(){ const m={}; D.spots.forEach(s=>{ if(s.depto) (m[s.depto]=m[s.depto]||[]).push(s); }); return m; }
const sortDeptos = ks => ks.sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));

/* ---------- Render global ---------- */
function renderAll(){
  const c = counts(D.spots);
  $('kpis').innerHTML = `<div class="kpi">Total <b>${D.spots.length}</b></div>` +
    D.estados.map(e=>`<div class="kpi"><i class="dot" style="background:${COL[e]}"></i>${e} <b>${c[e]}</b></div>`).join('');
  $('dlDeptos').innerHTML = sortDeptos(Object.keys(deptoMap())).map(k=>`<option value="${esc(k)}">`).join('');
  renderPisoSelect(); renderChips(); renderMarks(); renderSide();
  if ($('vDash').classList.contains('on')) renderDash();
  if ($('vList').classList.contains('on')) renderList();
}

function renderChips(){

/* ---------- Plano ---------- */
async function cargarPiso(p){
  piso = p; sel.clear(); resetForm();
  const info = D.pisos.find(x => x.piso === p);
  $('vpmsg').style.display = ''; $('vpmsg').textContent = 'Cargando plano…';
  $('img').style.visibility = 'hidden';
  renderAll();
  try{
    if (!imgCache[info.plano]) imgCache[info.plano] = await api('getPlano', info.plano);
    if (piso !== p) return;
    const img = $('img');
    await new Promise((r, rej) => { img.onload = r; img.onerror = () => rej(new Error('No se pudo cargar el plano. Recarga la página.')); img.src = imgCache[info.plano]; if (img.complete && img.naturalWidth) r(); });
    view.W = img.naturalWidth; view.H = img.naturalHeight;
    $('stage').style.width = view.W+'px'; $('stage').style.height = view.H+'px';
    img.style.visibility = ''; $('vpmsg').style.display = 'none';
    fit();
  }catch(e){ $('vpmsg').textContent = e.message || String(e); }
}

function renderMarks(){
  const list = spotsPiso(piso);
  const qs = q.toLowerCase();
  $('marks').innerHTML = list.filter(s => s.xy).map(s => {
    const hit = qs && (String(s.n) === qs || (s.depto && s.depto.toLowerCase() === qs));
    const part = qs && !hit && s.depto && s.depto.toLowerCase().includes(qs);
    const c = ['mk', cls(s.estado), sel.has(s.n)?'sel':'', ocultos.has(s.estado)?'off':'',
               qs ? (hit||part ? 'hit' : 'dim') : ''].join(' ');
    return `<button class="${c}" data-n="${s.n}" style="left:${s.xy[0]}%;top:${s.xy[1]}%"><span>${s.n}</span>${s.depto?`<em>${esc(s.depto)}</em>`:''}</button>`;
  }).join('');
  // resultados en otros pisos
  const f = $('found');
  if (qs){
    const m = D.spots.filter(s => String(s.n) === qs || (s.depto && s.depto.toLowerCase().includes(qs)));
    f.style.display = 'block';
    f.innerHTML = m.length ? `<b>${m.length} resultado${m.length>1?'s':''}:</b> ` +
      m.slice(0,30).map(s=>`<a data-go="${s.n}">${s.n}${s.depto?' ('+esc(s.depto)+')':''} · ${s.piso}</a>`).join(' ')
      : 'Sin resultados';
  } else f.style.display = 'none';
  applyView();
}

function applyView(){
  $('stage').style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.s})`;
  $('stage').style.setProperty('--inv', (1/view.s).toFixed(4));
  $('stage').classList.toggle('det', view.s >= 0.55);
}
function fit(){
  const r = $('vp').getBoundingClientRect();
  view.s = Math.min(r.width/view.W, r.height/view.H) * 0.97;
  view.tx = (r.width - view.W*view.s)/2; view.ty = (r.height - view.H*view.s)/2;
  applyView();
}
function zoomAt(k, mx, my){
  const ns = Math.min(3, Math.max(0.1, view.s*k)); k = ns/view.s;
  view.tx = mx - (mx - view.tx)*k; view.ty = my - (my - view.ty)*k; view.s = ns; applyView();
}
function centerOn(s){
  if (!s.xy) return;
  const r = $('vp').getBoundingClientRect();
  if (view.s < 0.6) view.s = 0.7;
  view.tx = r.width/2 - s.xy[0]/100*view.W*view.s;
  view.ty = r.height/2 - s.xy[1]/100*view.H*view.s;
  applyView();
}

function renderSide(){

  if (!sel.size){
    const list = spotsPiso(piso), c = counts(list), tot = list.length || 1;
    const dm = {}; list.forEach(s => { if (s.depto) (dm[s.depto]=dm[s.depto]||[]).push(s.n); });

    ${one ? `<div class="info">Piso <b>${one.piso}</b> · Estado actual <b>${one.estado}</b>${one.depto?` · Depto <b>${esc(one.depto)}</b>`:''}${one.fecha?`<br>Actualizado: ${esc(one.fecha)}`:''}</div>` : ''}
    <label class="l">Nuevo estado</label>
    <div class="seg" id="seg">${D.estados.map(e=>`<button data-st="${e}" class="${form.estado===e?'on':''}"><i class="dot" style="background:${COL[e]}"></i>${e}</button>`).join('')}</div>
    <label class="l">Departamento</label>
    <input class="fld" id="fDep" list="dlDeptos" placeholder="${needD?'Ej. 1204':'No aplica'}" value="${esc(needD?form.depto:'')}" ${needD?'':'disabled'} autocomplete="off">
    <label class="l">Observaciones</label>
    <textarea class="fld" id="fObs" placeholder="Opcional">${esc(form.obs)}</textarea>
    ${otros.length ? `<div class="warn">⚠ ${otros.map(s=>`${s.n} está con ${esc(s.depto)}`).join(', ')}. Al guardar se reasigna.</div>` : ''}
    <div class="acts">
      <button class="btn p" id="bSave">Guardar</button>
      ${ss.some(s=>s.estado!=='Libre') ? '<button class="btn r" id="bFree">Liberar</button>' : ''}

async function guardar(nums, cambios, msg){
  document.querySelectorAll('#bSave,#bFree').forEach(b=>b.disabled=true);
  try{
    D = await api('guardar', nums, cambios);
    toast(msg); return true;
  }catch(e){ toast(e.message || String(e), true); return false; }
  finally{ document.querySelectorAll('#bSave,#bFree').forEach(b=>b.disabled=false); }
}

async function guardarFila(tr){
  const n = Number(tr.dataset.n), s = byN(n);
  let estado = tr.querySelector('[data-f=estado]').value;
  const dInp = tr.querySelector('[data-f=depto]');
  let depto = dInp.value.trim().toUpperCase(), obs = tr.querySelector('[data-f=obs]').value.trim();
  if (depto && estado === 'Libre') estado = 'Asignado';           // escribir depto en uno libre lo asigna
  if (!depto && s.depto && (estado === 'Asignado' || estado === 'Reservado') && estado === s.estado) estado = 'Libre'; // borrar depto lo libera
  if ((estado === 'Asignado' || estado === 'Reservado') && !depto){
    dInp.classList.add('need'); dInp.focus(); toast('Escribe el departamento para dejarlo ' + estado); return;
  }
  if (estado === s.estado && depto === (s.depto||'') && obs === (s.obs||'')) return;
  tr.querySelectorAll('td').forEach(td=>td.classList.add('saving'));
  const ok = await guardar([n], {estado, depto, obs}, `Estac. ${n} → ${estado}${depto?' · '+depto:''}`);
  renderAll(); if (!ok) renderList();
}

// Zoom con rueda y arrastre para mover
const vp = $('vp');
vp.addEventListener('wheel', e => { e.preventDefault(); const r=vp.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
let drag = null;
vp.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty, moved:false}; });
window.addEventListener('pointermove', e => {
  if (drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (!drag.moved && Math.hypot(dx,dy) > 5){ drag.moved = true; vp.classList.add('drag'); vp.setPointerCapture && vp.setPointerCapture(e.pointerId); }
    if (drag.moved){ view.tx = drag.tx+dx; view.ty = drag.ty+dy; applyView(); }
    $('tip').style.display='none'; return;
  }
  const mk = e.target.closest && e.target.closest('.mk'), tip = $('tip');
  if (mk){
    const s = byN(Number(mk.dataset.n));
    tip.innerHTML = `<b>Estac. ${s.n}</b> · Piso ${s.piso}<br>${s.estado}${s.depto?' · Depto <b>'+esc(s.depto)+'</b>':''}${s.obs?'<br>'+esc(s.obs):''}`;
    tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
  } else tip.style.display='none';
});
window.addEventListener('pointerup', e => {
  if (!drag) return;
  const moved = drag.moved; drag = null; vp.classList.remove('drag');
  if (moved) return;
  const mk = e.target.closest && e.target.closest('.mk');
  if (!mk) return;
  const n = Number(mk.dataset.n);
  sel.has(n) ? sel.delete(n) : sel.add(n);
  resetForm(); renderMarks(); renderSide();
});

    if (!iniciado){ iniciado = true; cargarPiso(D.pisos[0].piso); } else renderAll();
  }catch(e){
    if (e.auth) return;
    const m = e.message || String(e);
    if ($('login').hidden) $('vpmsg').textContent = m;
    else $('lgErr').textContent = 'Contraseña correcta, pero no se pudieron leer los datos: ' + m;
  }
}

$('lgForm').addEventListener('submit', async e => {
  e.preventDefault();
  const nombre = $('lgNombre').value.trim(), password = $('lgPass').value;
  $('lgBtn').disabled = true; $('lgErr').textContent = '';
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'No se pudo iniciar sesión');
    USUARIO = nombre; try { localStorage.setItem('estac_nombre', nombre); } catch(_) {}
    $('lgPass').value = '';
    await iniciar();
    if (!$('login').hidden && !$('lgErr').textContent)
      $('lgErr').textContent = 'No se pudo mantener la sesión. Revisa que el navegador permita cookies para este sitio.';
  }catch(err){ $('lgErr').textContent = err.message; }
  finally{ $('lgBtn').disabled = false; }
});

$('bSalir').onclick = async () => {
  try { await fetch('/api/logout', {method:'POST'}); } catch(e) {}
  mostrarLogin();
};

// Refresca cada 45 s para ver cambios de otros usuarios (sin interrumpir ediciones)
setInterval(async () => {
  if (!iniciado || window.DEMO || document.hidden || sel.size || !$('login').hidden) return;
  const a = document.activeElement;
  if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.id !== 'q') return;
  try { D = await api('getDatos'); renderAll(); } catch(e) {}
}, 45000);

if (window.DEMO){ $('bSalir').style.display = 'none'; iniciar(); toast('Modo demo: datos de ejemplo'); }
else iniciar();
</script>
</body>
</html>
